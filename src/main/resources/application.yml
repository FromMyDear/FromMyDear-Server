spring:
  application:
    name: frommydear-server
  datasource:
    # 로컬 기본값은 compose.yaml과 맞춰 두었다. 운영에서는 반드시 환경 변수로 덮어쓴다.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:frommydear}
    username: ${DB_USERNAME:frommydear}
    password: ${DB_PASSWORD:frommydear}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway만 변경한다
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
